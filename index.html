<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 | 商業諮詢表單</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .form-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .form-header {
            margin-bottom: 24px;
        }

        .form-header h2 {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #000;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status-msg {
            margin-top: 16px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.875rem;
            text-align: center;
            display: none;
        }

        .status-msg.success {
            background-color: #064e3b;
            color: #6ee7b7;
        }

        .status-msg.error {
            background-color: #7f1d1d;
            color: #fca5a5;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="form-header">
        <h2>預約諮詢 / 專案合作</h2>
        <p>請填寫下方資訊，我們將在第一時間主動與您聯繫。</p>
    </div>

    <form id="contactForm">
        <div class="form-group">
            <label for="name">您的姓名 *</label>
            <input type="text" id="name" name="name" required placeholder="例如：李先生">
        </div>

        <div class="form-group">
            <label for="email">電子郵件 *</label>
            <input type="email" id="email" name="email" required placeholder="name@example.com">
        </div>

        <div class="form-group">
            <label for="message">需求說明 *</label>
            <textarea id="message" name="message" required placeholder="請簡述您的專案需求或想諮詢的細節..."></textarea>
        </div>

        <button type="submit" id="submitBtn">送出資料</button>
    </form>

    <div id="statusMsg" class="status-msg"></div>
</div>

<script>
    // ⚠️ 買家只需修改此處的 Webhook 網址
    const N8N_WEBHOOK_URL = "https://primary-production-5317642b.up.railway.app/webhook/5e2bb1ce-7f7f-4a42-b6df-3490b2ac0124";

    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        submitBtn.disabled = true;
        submitBtn.innerText = '處理中...';
        statusMsg.style.display = 'none';

        const payload = {
            name: form.name.value,
            email: form.email.value,
            message: form.message.value
        };

        try {
            const response = await fetch(N8N_WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                statusMsg.className = 'status-msg success';
                statusMsg.innerText = '✅ 提交成功！我們已收到您的資訊，會盡快聯繫您。';
                statusMsg.style.display = 'block';
                form.reset();
            } else {
                throw new Error('伺服器回應異常');
            }
        } catch (error) {
            statusMsg.className = 'status-msg error';
            statusMsg.innerText = '❌ 發送失敗，請稍後再試或直接聯繫客服。';
            statusMsg.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = '送出資料';
        }
    });
</script>

</body>
</html>
